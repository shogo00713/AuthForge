<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune App</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Georgia, "Times New Roman", serif;
      background: #fafafa;
      color: #222;
    }

    .container {
      text-align: center;
      margin-top: -80px;
    }

    h1 {
      font-size: 56px;
      font-weight: normal;
      margin-bottom: 16px;
    }

    p {
      font-size: 17px;
      color: #666;
      margin-bottom: 32px;
    }

    .login-button {
      display: inline-block;
      padding: 12px 28px;

      font-family: inherit;
      font-size: 16px;

      color: white;
      background: #222;

      border: none;

      cursor: pointer;
    }

    .login-button:hover {
      background: #444;
    }

    .error-message {
      color: #c0392b;
      font-size: 30px;
      margin-bottom: 16px;
      margin-top: -16px;
      display: none;
    }
  </style>

</head>

<body>

  <main class="container">
    <h1>Fortune App</h1>

    <p id="error-message" class="error-message"></p>

    <p>
      あなたのプロフィールから、今日の運勢を占います。
    </p>

    <button class="login-button" onclick="window.location.href='/login?scope=profile:basic'">
      一部アクセスでログイン
    </button>
    <button class="login-button" onclick="window.location.href='/login?scope=profile:full'">
      フルアクセスでログイン
    </button>
  </main>

  <script>
    // callbackでのエラーはクエリパラメータ経由でここに戻ってきて表示する
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (error) {
      const el = document.getElementById("error-message");
      el.textContent = error;
      el.style.display = "block";
    }
  </script>

</body>
</html>
