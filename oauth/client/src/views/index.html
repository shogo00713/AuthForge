<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune App</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Georgia, "Times New Roman", serif;
      background: #fafafa;
      color: #222;
    }

    .container {
      text-align: center;
      margin-top: -80px;
    }

    h1 {
      font-size: 56px;
      font-weight: normal;
      margin-bottom: 16px;
    }

    p {
      font-size: 17px;
      color: #666;
      margin-bottom: 32px;
    }

    .login-button {
      display: inline-block;
      padding: 12px 28px;

      font-family: inherit;
      font-size: 16px;

      color: white;
      background: #222;

      border: none;

      cursor: pointer;
    }

    .login-button:hover {
      background: #444;
    }
  </style>
  
</head>

<body>

  <main class="container">
    <h1>Fortune App</h1>

    <p>
      あなたのプロフィールから、今日の運勢を占います。
    </p>

    <button class="login-button">
      Login with OAuth
    </button>
  </main>

</body>
</html>
