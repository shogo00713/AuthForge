<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Login Successful - AuthForge</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 360px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .icon {
            font-size: 48px;
        }

        h1 {
            margin-top: 15px;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
        }

        a:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">✓</div>

        <h1>Login Successful</h1>

        <p>Authentication succeeded.</p>

        <a href="/dashboard">
            Go to Dashboard
        </a>

    </div>

</body>

</html>
